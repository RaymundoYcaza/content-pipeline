[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-pipeline"
version = "0.1.0"
description = "Deterministic AI-assisted content pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer[all]>=0.12",
  "python-frontmatter>=1.1.0",
  "PyYAML>=6.0.1",
  "requests>=2.32.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0"
]

[project.scripts]
pipeline = "pipeline.cli:app"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
