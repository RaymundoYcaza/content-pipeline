project:
  brand: "RaymundoYcaza"
  content_root: "./content"
  timezone: "America/Guayaquil"

providers:
  active_text: "openrouter"
  active_embeddings: "ollama"

  ollama:
    target: "cloud"   # cloud | localhost | lan
    cloud_url: "https://ollama.com"
    localhost_url: "http://localhost:11434"
    lan_url: "http://192.168.100.81:11434"
    api_key_env: "OLLAMA_API_KEY"
    text_model: "gemma4:31b-cloud"
    embedding_model: "embeddinggemma"

  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env_primary: "OPENROUTER_API_KEY_1"
    api_key_env_secondary: "OPENROUTER_API_KEY_2"
    text_model: "nousresearch/hermes-3-llama-3.1-405b"
    embedding_model: ""

runtime:
  delay_between_calls_ms: 3000
  delay_between_steps_ms: 8000
  max_retries: 4
  retry_backoff_seconds: 20
  switch_api_key_on_rate_limit: true
  dry_run: false

similarity:
  review_threshold: 0.72
  reject_threshold: 0.84
  keyword_review_threshold: 0.60

logging:
  level: "INFO"
